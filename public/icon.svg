<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <style>
    :root {
      --coupe-stroke: #9E3E30;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --coupe-stroke: #D85640;
      }
    }
    .monogram-stroke {
      stroke: var(--coupe-stroke);
    }
  </style>
  <rect
    x="24"
    y="2"
    width="31"
    height="31"
    transform="rotate(45 24 2)"
    class="monogram-stroke"
    stroke="#9E3E30"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <!-- A coupe reduced to three strokes. -->
  <path d="M17 19 Q24 28 31 19" class="monogram-stroke" stroke="#9E3E30" stroke-width="2.5" stroke-linecap="round" />
  <path d="M16 19 H32" class="monogram-stroke" stroke="#9E3E30" stroke-width="2.5" stroke-linecap="round" />
  <path d="M24 28 V33" class="monogram-stroke" stroke="#9E3E30" stroke-width="2.5" stroke-linecap="round" />
  <path d="M19 33.5 H29" class="monogram-stroke" stroke="#9E3E30" stroke-width="2.5" stroke-linecap="round" />
</svg>
