# Cloudflare Workers Configuration (Astro SSR)
name = "crystal-coupe"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# OAuth sessions and authorization state (src/lib/atproto/store.ts) live in the
# `SESSION` KV namespace, which the Cloudflare adapter declares for Astro
# sessions and Cloudflare provisions and inherits on every deploy — so there is
# no namespace id to keep in this file. A dedicated `ATPROTO_SESSIONS` binding
# was declared here with a placeholder id, and the placeholder failed the
# deploy outright: "KV namespace 'REPLACE_WITH_KV_NAMESPACE_ID' is not valid".
#
# One namespace holds both because the keys cannot collide: the OAuth stores
# prefix theirs `session:` and `state:`, Astro writes bare session ids.
#
# To split them later, create a namespace (`wrangler kv namespace create
# ATPROTO_SESSIONS`, or the dashboard's Storage & Databases → KV), declare it
# here with its real id, and point SESSION_KV_BINDING at it:
#
#   [[kv_namespaces]]
#   binding = "ATPROTO_SESSIONS"
#   id = "<the id it prints>"

# Rate limiting for the model routes. A module-scope Map is per-isolate on
# Workers, so the in-memory limiter in src/lib/rate-limit-logic.ts cannot hold
# on its own — it stays as the local/dev fallback. See docs/generation.md.
#
# `namespace_id` is an arbitrary but stable identifier for this limiter;
# changing it resets every counter. `period` accepts only 10 or 60.
[[unsafe.bindings]]
name = "GENERATION_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
