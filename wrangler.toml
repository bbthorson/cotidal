# Cloudflare Workers Configuration (Astro SSR)
# Must match the Worker's name in the Cloudflare dashboard, which Workers Builds
# deploys from `main`; a mismatch fails the build, and production stays on the
# last good deploy. The resources below keep their pre-rename names
# (`crystal-coupe-kv`, the `crystal-coupe-gateway` AI Gateway): those are other
# objects, found by id or by their own name, not by the Worker's.
name = "cotidal"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Astro's handler, plus the Durable Object classes below (src/worker.ts).
main = "src/worker.ts"

# Cloudflare Workers AI binding for inference on Cloudflare edge GPUs
# Routed through AI Gateway for caching, observability, and model controls (docs/generation.md).
[ai]
binding = "AI"

# Sign-in's switch (src/lib/atproto/auth.ts, `signInEnabled()`), read by the
# server at runtime. It lives here rather than in the dashboard because
# `wrangler deploy` replaces the Worker's plain-text variables with this
# file's on every deploy, so one set only in the dashboard is gone by the next
# release. Secrets are not affected. Sign-in also needs `SESSION_SECRET`;
# without it this switch does nothing, which is what keeps local previews and
# CI signed out.
[vars]
ATPROTO_ENABLED = "true"

# Sign-in sessions and OAuth state (src/lib/atproto/auth.ts), kept by
# @bbthorson/atproto-cf-auth and sealed with the `SESSION_SECRET` Worker secret
# (`wrangler secret put SESSION_SECRET`, 32+ random characters). Without this
# namespace the package falls back to memory, which is per-isolate on Workers —
# so a signed-in user is signed out whenever a request lands on a cold isolate.
# Without the secret, sign-in is disabled rather than sealed under a default.
#
# `crystal-coupe-kv`, created in the dashboard. The id is an account-scoped
# resource identifier, not a secret, and belongs in this file — an earlier
# placeholder here failed the deploy at the API: "KV namespace
# 'REPLACE_WITH_KV_NAMESPACE_ID' is not valid" [code: 10042].
#
# `astro preview` and `wrangler dev` create a local namespace and ignore the id.
[[kv_namespaces]]
binding = "ATPROTO_SESSIONS"
id = "063ec4c7be684f5e912e45484e3e9e8b"

# Rate limiting for the model routes. A module-scope Map is per-isolate on
# Workers, so the in-memory limiter in src/lib/rate-limit-logic.ts cannot hold
# on its own — it stays as the local/dev fallback. See docs/generation.md.
#
# `namespace_id` is an arbitrary but stable identifier for this limiter;
# changing it resets every counter. `period` accepts only 10 or 60.
[[unsafe.bindings]]
name = "GENERATION_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# One lock per member around every session restore, so two requests on
# different isolates cannot both spend the one-use refresh token and sign
# them out (src/lib/atproto/auth.ts, `requestLock`). The class comes from
# @bbthorson/atproto-cf-auth and is exported by src/worker.ts. It keeps no
# storage: a lease lives in memory for the seconds a restore takes.
[[durable_objects.bindings]]
name = "AUTH_LOCK"
class_name = "AuthLock"

[[migrations]]
tag = "atproto-cf-auth-lock-v1"
new_sqlite_classes = ["AuthLock"]
