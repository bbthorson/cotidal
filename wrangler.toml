# Cloudflare Workers Configuration (Astro SSR)
name = "crystal-coupe"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# OAuth sessions and authorization state (src/lib/atproto/store.ts). Without a
# KV namespace, NodeOAuthClient keeps both in a module-scope Map, which is
# per-isolate on Workers — so client.restore(did) fails whenever a request lands
# on a cold isolate and every signed-in action silently breaks.
#
# `crystal-coupe-kv`, created in the dashboard. The id is an account-scoped
# resource identifier, not a secret, and belongs in this file — an earlier
# placeholder here failed the deploy at the API: "KV namespace
# 'REPLACE_WITH_KV_NAMESPACE_ID' is not valid" [code: 10042].
#
# `astro preview` and `wrangler dev` create a local namespace and ignore the id.
[[kv_namespaces]]
binding = "ATPROTO_SESSIONS"
id = "063ec4c7be684f5e912e45484e3e9e8b"

# Rate limiting for the model routes. A module-scope Map is per-isolate on
# Workers, so the in-memory limiter in src/lib/rate-limit-logic.ts cannot hold
# on its own — it stays as the local/dev fallback. See docs/generation.md.
#
# `namespace_id` is an arbitrary but stable identifier for this limiter;
# changing it resets every counter. `period` accepts only 10 or 60.
[[unsafe.bindings]]
name = "GENERATION_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
