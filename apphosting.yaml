# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

  # AT Protocol / Bluesky OAuth (opt-in)
  # To enable, set NEXT_PUBLIC_ATPROTO_ENABLED to "true" and configure secrets:
  #   firebase apphosting:secrets:set atproto-client-id
  #   firebase apphosting:secrets:set atproto-redirect-uri
  #   firebase apphosting:secrets:grantaccess atproto-client-id
  #   firebase apphosting:secrets:grantaccess atproto-redirect-uri
  # Then uncomment the env block below:
  #
  # env:
  #   - variable: NEXT_PUBLIC_ATPROTO_ENABLED
  #     value: "true"
  #   - variable: ATPROTO_CLIENT_ID
  #     availability:
  #       - BUILD
  #       - RUNTIME
  #     secret: atproto-client-id
  #   - variable: ATPROTO_REDIRECT_URI
  #     availability:
  #       - BUILD
  #       - RUNTIME
  #     secret: atproto-redirect-uri
